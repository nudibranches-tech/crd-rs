[workspace]
resolver = "2"
members = [
    "crates/barman-cloud",
    "crates/cilium",
    "crates/cnpg",
    "crates/kubevirt",
    "crates/kubevirt-cdi",
]

[workspace.dependencies]
k8s-openapi = { version = "0.28" }
kube = { version = "4.2", default-features = false }
kube-core = { version = "4.2", default-features = false }
kube-derive = { version = "4.2" }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
