name: Release

on:
  push:
    tags:
      - "crd-rs-barman-cloud@*"
      - "crd-rs-cdi@*"
      - "crd-rs-cilium@*"
      - "crd-rs-cnpg@*"
      - "crd-rs-kubevirt@*"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.32", "1.33", "1.34", "1.35", "1.36"]
    env:
      K8S_OPENAPI_ENABLED_VERSION: ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Extract crate name from tag
        id: crate
        run: echo "name=${GITHUB_REF_NAME%%@*}" >> "$GITHUB_OUTPUT"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "${{ steps.crate.outputs.name }}" --token "$CARGO_REGISTRY_TOKEN"
