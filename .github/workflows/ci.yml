name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Kubernetes version k8s-openapi 0.28 supports. These crates enable
        # no version feature of their own, so a consumer may pick any of them.
        k8s: ["1.32", "1.33", "1.34", "1.35", "1.36"]
    env:
      K8S_OPENAPI_ENABLED_VERSION: ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
