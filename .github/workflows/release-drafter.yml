name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cnpg:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter-cnpg.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cilium:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter-cilium.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  barman-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter-barman-cloud.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kubevirt:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter-kubevirt.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cdi:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter-kubevirt-cdi.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
